<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Experiment</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px 4px;
    background: #fff;
    font-family: Arial, sans-serif;
    color: #222;
  }
  main { max-width: 1400px; margin: auto; }
  .videos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
  }
  h2 {
    margin: 0 0 16px;
    text-align: center;
    font-size: clamp(18px, 2.5vw, 28px);
    color: #850e4b;
  }
  video {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    background: #111;
  }
  body.rgb-method video { background: #fff; }
  body.hide-labels h2 { display: none; }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  button {
    padding: 10px 18px;
    border: 1px solid #850e4b;
    border-radius: 6px;
    background: #fff;
    color: #850e4b;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #clock { font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .videos { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <div class="videos">
    <section>
      <h2>Robot View</h2>
      <video muted playsinline preload="auto" aria-label="Robot View"></video>
    </section>
    <section>
      <h2>Edge View</h2>
      <video muted playsinline preload="auto" aria-label="Edge View"></video>
    </section>
    <section>
      <h2>LLM Interface</h2>
      <video muted playsinline preload="auto" aria-label="LLM Interface"></video>
    </section>
  </div>
  <div class="controls">
    <button id="play" disabled>Play</button>
    <button id="pause" disabled>Pause</button>
    <button id="restart" disabled>Restart</button>
    <span id="clock">Loading videos...</span>
  </div>
</main>
<script>
(() => {
  "use strict";

  // One page per Google Sites row, selected by ?method=...
  const VIDEO_GROUPS = {
    sorting_rgb: [
      "sorting_rgb/robot_view.mp4",
      "sorting_rgb/rgb_images.mp4",
      "sorting_rgb/llm_conversation.mp4"
    ],
    sorting_3dsg: [
      "sorting_3dsg/robot_view.mp4",
      "sorting_3dsg/3dbbox_UI.mp4",
      "sorting_3dsg/slm_conversation.mp4"
    ],
    sorting_2dsg: [
      "sorting_2dsg/robot_view.mp4",
      "sorting_2dsg/2dsg_black_view.mp4",
      "sorting_2dsg/slm_conversation.mp4"
    ]
  };

  // Each Image view is cropped from the same PowerPoint screen recording.
  // Keep the shared recording timeline, including its original visual lag.
  const PLAYBACK_ITEMS = {
    sorting_rgb: [
      { video: 0, start: 0 },
      { video: 1, start: 0 },
      { video: 2, start: 0 }
    ],
    sorting_2dsg: [
      { video: 2, start: 2.2652687 },
      { video: 0, start: 0 },
      { video: 1, start: 2.2620996 }
    ],
    sorting_3dsg: [
      { video: 1, start: 0 },
      { video: 0, start: 0 },
      { video: 2, start: 0 }
    ]
  };

  const VIDEO_LABELS = ["Robot View", "Edge View", "LLM Interface"];
  const AUTO_PLAY = true;
  const params = new URLSearchParams(location.search);
  const method = params.get("method") || "sorting_rgb";
  if (method === "sorting_rgb") document.body.classList.add("rgb-method");
  if (params.get("labels") === "0") document.body.classList.add("hide-labels");
  const playbackItems = PLAYBACK_ITEMS[method];
  const sequentialPlayback = false;
  const videos = [...document.querySelectorAll("video")];
  const playButton = document.getElementById("play");
  const pauseButton = document.getElementById("pause");
  const restartButton = document.getElementById("restart");
  const clock = document.getElementById("clock");
  const main = document.querySelector("main");
  let sourcesReady = false;
  let failed = false;
  const state = {
    phase: "loading",
    epoch: 0,
    cursor: 0,
    advancing: false,
    initialized: false,
    inViewport: false,
    intersectionKnown: false
  };
  const objectURLs = [];
  const downloadController = new AbortController();

  const loaded = () => Boolean(playbackItems) && sourcesReady && !failed && videos.every(v =>
    !v.error && v.readyState >= 2 &&
    Number.isFinite(v.duration) && v.duration > 0
  );

  function format(seconds) {
    const s = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }

  function activeItem() {
    return playbackItems?.[state.cursor] || null;
  }

  function updateUI() {
    const ready = loaded();
    playButton.disabled = !ready || state.phase !== "paused";
    pauseButton.disabled = !ready || state.phase !== "playing";
    restartButton.disabled = !ready || state.phase === "resetting";

    if (failed || state.phase === "error") {
      clock.textContent = "Playback error";
      clock.title = "Playback error";
      return;
    }

    if (!ready) {
      clock.textContent = "Loading videos...";
      clock.title = "Waiting for video data";
      return;
    }

    if (sequentialPlayback) {
      const item = activeItem();
      const total = playbackItems.reduce((sum, entry) =>
        sum + Math.max(0, videos[entry.video].duration - entry.start), 0
      );

      if (state.phase === "ended") {
        clock.textContent = `Finished · ${format(total)}`;
        clock.title = "PowerPoint sequence finished";
        return;
      }

      if (!item) return;
      const video = videos[item.video];
      const elapsed = Math.max(0, video.currentTime - item.start);
      const itemTotal = Math.max(0, video.duration - item.start);
      const status = state.phase === "paused" ? "Paused" : "Playing";
      clock.textContent =
        `${status} · ${state.cursor + 1}/3 ${VIDEO_LABELS[item.video]} · ` +
        `${format(elapsed)} / ${format(itemTotal)}`;
      clock.title = "Image follows the PowerPoint Robot, Edge, LLM sequence";
      return;
    }

    const unfinished = videos.filter(video => !video.ended).length;
    const elapsed = Math.max(...playbackItems.map(item =>
      Math.max(0, videos[item.video].currentTime - item.start)
    ));
    const total = Math.max(...playbackItems.map(item =>
      Math.max(0, videos[item.video].duration - item.start)
    ));

    if (state.phase === "ended") {
      clock.textContent = `Finished · ${format(total)}`;
      clock.title = "Playback finished";
    } else {
      const status = state.phase === "paused" ? "Paused" : "Playing";
      clock.textContent = `${status} · ${unfinished}/${videos.length} active · ${format(elapsed)} / ${format(total)}`;
      clock.title = "Shared playback controls";
    }
  }

  function failPlayback(message, error) {
    failed = true;
    state.phase = "error";
    state.epoch++;
    videos.forEach(v => v.pause());
    playButton.title = message;
    if (error) console.error(message, error);
    updateUI();
  }

  function seekVideo(video, seconds, token) {
    return new Promise((resolve, reject) => {
      if (token !== state.epoch) {
        resolve(false);
        return;
      }

      if (!Number.isFinite(video.duration) || seconds < 0 || seconds >= video.duration) {
        reject(new Error(`Invalid start time ${seconds} for ${video.duration}s video.`));
        return;
      }

      const target = seconds;
      if (!video.seeking && Math.abs(video.currentTime - target) < 0.01) {
        resolve(true);
        return;
      }

      let settled = false;
      const timeout = setTimeout(() => finish(new Error("Timed out while seeking video.")), 10000);

      function cleanup() {
        clearTimeout(timeout);
        video.removeEventListener("seeked", onSeeked);
        video.removeEventListener("error", onError);
      }

      function finish(error) {
        if (settled) return;
        settled = true;
        cleanup();
        if (error) reject(error);
        else resolve(token === state.epoch);
      }

      function onSeeked() {
        finish();
      }

      function onError() {
        finish(new Error("Video failed while seeking."));
      }

      video.addEventListener("seeked", onSeeked);
      video.addEventListener("error", onError);

      try {
        video.currentTime = target;
      } catch (error) {
        finish(error);
      }
    });
  }

  async function playAll(token) {
    if (token !== state.epoch || state.phase !== "playing" || !loaded()) return;

    const playable = videos.filter(video => !video.ended);
    if (!playable.length) {
      state.phase = "ended";
      updateUI();
      return;
    }

    playButton.title = "";
    updateUI();

    // Issue every play request before awaiting any of them.
    const results = await Promise.allSettled(playable.map(video => video.play()));

    // A Pause or Restart may happen before the play promises settle.
    if (token !== state.epoch || state.phase !== "playing") {
      videos.forEach(video => video.pause());
      return;
    }

    const rejected = results.find(result => result.status === "rejected");
    if (rejected) {
      videos.forEach(video => video.pause());
      state.phase = "paused";
      playButton.title = "Autoplay was blocked. Click Play to continue.";
      console.warn("Parallel playback did not start.", rejected.reason);
      updateUI();
    }
  }

  async function playActive(token) {
    if (token !== state.epoch || state.phase !== "playing" || !loaded()) return;

    const item = activeItem();
    if (!item) return;

    const video = videos[item.video];
    videos.forEach((candidate, index) => {
      if (index !== item.video) candidate.pause();
    });

    if (video.ended) {
      advanceSequential(item.video);
      return;
    }

    playButton.title = "";
    updateUI();

    try {
      await video.play();
      if (token !== state.epoch || state.phase !== "playing") video.pause();
    } catch (error) {
      if (token !== state.epoch) return;
      videos.forEach(v => v.pause());
      state.phase = "paused";
      playButton.title = "Autoplay was blocked. Click Play to continue.";
      console.warn("Sequential playback did not start.", error);
      updateUI();
    }
  }

  function playCurrentMode(token) {
    return sequentialPlayback ? playActive(token) : playAll(token);
  }

  function advanceSequential(videoIndex) {
    const item = activeItem();
    if (
      !sequentialPlayback ||
      state.phase !== "playing" ||
      state.advancing ||
      !item ||
      item.video !== videoIndex ||
      !videos[videoIndex].ended
    ) return;

    state.advancing = true;

    if (state.cursor + 1 >= playbackItems.length) {
      state.epoch++;
      state.phase = "ended";
      state.advancing = false;
      updateUI();
      return;
    }

    state.cursor++;
    const token = ++state.epoch;
    state.advancing = false;
    updateUI();
    void playCurrentMode(token);
  }

  async function resetGroup(shouldPlay) {
    if (!loaded()) return;

    const token = ++state.epoch;
    state.phase = "resetting";
    state.cursor = 0;
    state.advancing = false;
    videos.forEach(v => v.pause());
    playButton.title = "";
    updateUI();

    try {
      await Promise.all(playbackItems.map(item =>
        seekVideo(videos[item.video], item.start, token)
      ));

      if (token !== state.epoch) return;

      state.phase = shouldPlay ? "playing" : "paused";
      updateUI();
      if (shouldPlay) await playCurrentMode(token);
    } catch (error) {
      if (token !== state.epoch) return;
      failPlayback("Could not prepare the video group.", error);
    }
  }

  async function initializeIfReady() {
    if (state.initialized || !loaded() || !state.intersectionKnown) return;
    state.initialized = true;
    await resetGroup(AUTO_PLAY && state.inViewport && !document.hidden);
  }

  function pauseGroup() {
    if (!loaded() || state.phase !== "playing") return;
    state.epoch++;
    state.phase = "paused";
    state.advancing = false;
    videos.forEach(v => v.pause());
    updateUI();
  }

  function suspendGroup() {
    if (!loaded() || ["loading", "error", "ended"].includes(state.phase)) return;
    state.epoch++;
    state.phase = "paused";
    state.advancing = false;
    videos.forEach(v => v.pause());
    updateUI();
  }

  function handlePagePresence() {
    if (!loaded()) {
      void initializeIfReady();
      return;
    }

    if (state.inViewport && !document.hidden) {
      // Entering this embedded row is equivalent to entering its PowerPoint
      // slide: its video group restarts together.
      void resetGroup(AUTO_PLAY);
    } else {
      suspendGroup();
    }
  }

  playButton.addEventListener("click", () => {
    if (!loaded() || state.phase !== "paused") return;
    const token = ++state.epoch;
    state.phase = "playing";
    state.advancing = false;
    updateUI();
    void playCurrentMode(token);
  });

  pauseButton.addEventListener("click", pauseGroup);

  restartButton.addEventListener("click", () => {
    void resetGroup(true);
  });

  videos.forEach((v, index) => {
    v.muted = true;

    ["loadedmetadata", "loadeddata", "canplay", "canplaythrough", "seeked"]
      .forEach(event => {
        v.addEventListener(event, () => {
          updateUI();
          void initializeIfReady();
        });
      });

    ["timeupdate", "durationchange"].forEach(event => {
      v.addEventListener(event, updateUI);
    });

    v.addEventListener("ended", () => {
      if (sequentialPlayback) {
        advanceSequential(index);
      } else if (state.phase === "playing" && videos.every(video => video.ended)) {
        state.epoch++;
        state.phase = "ended";
      }
      updateUI();
    });

    v.addEventListener("error", () => {
      failPlayback("Video decoding failed. Check the file and browser.", v.error);
    });
  });

  // Fully download all three videos before starting the group.
  async function loadCompleteFiles() {
    const timeout = setTimeout(() => downloadController.abort(), 180000);

    try {
      if (
        !Object.prototype.hasOwnProperty.call(VIDEO_GROUPS, method) ||
        !Object.prototype.hasOwnProperty.call(PLAYBACK_ITEMS, method)
      ) {
        throw new Error(`Unknown video method: ${method}`);
      }

      playButton.title = "Waiting for video data.";

      const blobs = await Promise.all(VIDEO_GROUPS[method].map(async path => {
        const url = new URL(path, document.baseURI);
        // Avoid mixing newly replaced Image media with an older Pages cache.
        url.searchParams.set("player", method === "sorting_rgb"
          ? "landscape-crops-v1" : "slides-parallel-cfr-v5");

        const response = await fetch(url, {
          cache: "no-store",
          signal: downloadController.signal
        });

        if (!response.ok) {
          throw new Error(`${path}: HTTP ${response.status}`);
        }

        // This resolves only after the entire response body has been read.
        const blob = await response.blob();

        if (!blob.size || blob.type.includes("text/html")) {
          throw new Error(`${path}: empty file or HTML instead of MP4`);
        }

        return blob;
      }));

      // Use the original downloaded bytes without re-encoding.
      const urls = blobs.map(blob => URL.createObjectURL(blob));
      objectURLs.push(...urls);
      sourcesReady = true;

      urls.forEach((url, i) => {
        videos[i].src = url;
        videos[i].load();
      });

      playButton.title = "";
      updateUI();
      void initializeIfReady();
    } catch (error) {
      downloadController.abort();
      failPlayback("Loading failed. Reload this page to retry.", error);
    } finally {
      clearTimeout(timeout);
    }
  }

  updateUI();

  const visibilityObserver = new IntersectionObserver(entries => {
    const entry = entries[entries.length - 1];
    const wasInViewport = state.inViewport;
    state.intersectionKnown = true;
    state.inViewport = entry.isIntersecting && entry.intersectionRatio >= 0.25;

    if (!state.initialized) {
      void initializeIfReady();
    } else if (state.inViewport !== wasInViewport) {
      handlePagePresence();
    }
  }, { threshold: [0, 0.25, 0.5] });

  visibilityObserver.observe(main);
  document.addEventListener("visibilitychange", handlePagePresence);
  void loadCompleteFiles();

  window.addEventListener("pagehide", event => {
    if (!event.persisted) {
      state.epoch++;
      videos.forEach(v => v.pause());
      visibilityObserver.disconnect();
      downloadController.abort();
      objectURLs.forEach(url => URL.revokeObjectURL(url));
    }
  });

  // Preserve the existing Google Sites height-adaptation interface.
  function reportHeight() {
    if (window.parent === window) return;

    const css = getComputedStyle(document.body);
    const height = Math.ceil(
      main.getBoundingClientRect().height +
      parseFloat(css.paddingTop) +
      parseFloat(css.paddingBottom)
    );

    window.parent.postMessage({
      type: "robot-player-height",
      height
    }, "*");
  }

  new ResizeObserver(reportHeight).observe(main);
  window.addEventListener("load", reportHeight);

  window.addEventListener("message", event => {
    if (
      event.source === window.parent &&
      event.data?.type === "robot-player-request-height"
    ) {
      reportHeight();
    }
  });
})();
</script>
</body>
</html>
